# Build configuration
# Importante: VITE_STRIPE_PUBLISHABLE_KEY deve estar configurada nas Environment Variables
# para que o Stripe funcione corretamente no frontend (variáveis VITE_* são incluídas no build)
[build]
  publish = "dist"
  command = "npm run build"
  environment = { NODE_VERSION = "20" }
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.stripe.com https://*.stripe.network https://js.stripe.com https://maps.googleapis.com https://www.googletagmanager.com https://www.google-analytics.com https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com https://accounts.google.com https://*.google.com https://*.gstatic.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com https://www.gstatic.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com https://*.gstatic.com data: https://r2cdn.perplexity.ai; img-src 'self' data: https: https://www.google.com https://www.gstatic.com https://*.gstatic.com https://www.googletagmanager.com https://*.transparenttextures.com; media-src 'self' data: https:; connect-src 'self' https://*.stripe.com https://*.stripe.network https://js.stripe.com https://maps.googleapis.com https://ipapi.co https://www.google-analytics.com https://www.googletagmanager.com https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com https://*.gstatic.com https://accounts.google.com https://*.google.com https://*.googleapis.com https://*.supabase.co https://ab.reasonlabsapi.com https://*.transparenttextures.com; frame-src 'self' https://*.stripe.com https://*.stripe.network https://js.stripe.com https://translate.google.com https://translate.googleapis.com https://accounts.google.com https://*.google.com; child-src 'self' https://*.stripe.com https://*.stripe.network; upgrade-insecure-requests"
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
