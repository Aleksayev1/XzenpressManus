[build]
  command = "git lfs pull && npm run build"
  publish = "dist"
  functions = "netlify/functions"
  environment = { NODE_VERSION = "20", GIT_LFS_ENABLED = "true", GIT_LFS_FETCH_INCLUDE = "*.mp3" }

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# ═══ Funções Agendadas — Atualização Automática do Conhecimento ═══
[functions."weekly-knowledge-refresh"]
  schedule = "0 3 * * 1"
  # Roda toda segunda-feira às 03:00 UTC (00:00 Brasília)
  # Atualiza o banco de suplementos, interações e deficiências via Gemini AI

# ═══ Roteamento SPA Fallback no Netlify ═══
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ═══ Regras de Cache de Alta Performance (Evita Tela Branca Pós-Deploy) ═══
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
